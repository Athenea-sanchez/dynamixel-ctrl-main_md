baseURL = 'https://Athenea-sanchez.github.io/dynamixel-ctrl-main_md/'
languageCode = 'es-es'
locale = 'es-es'
title = 'Documentación Dynamixel'
contentDir = 'content'
enableEmoji = true

[module]
  [[module.imports]]
    path = "github.com/colinwilson/lotusdocs"
    disable = false
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    disable = false

[params]
  [params.docsearch]
    enable = false
  [params.sidebar]
    collapsible = trueEl archivo `hugo.toml` tiene un error crítico de sintaxis: las URLs introducidas tienen marcas de formato Markdown (`[text](url)`). En un archivo TOML, esto causa un fallo de compilación porque Hugo no puede procesar los corchetes ni los paréntesis dentro de las cadenas.

El archivo corregido y limpio queda de la siguiente manera:

```toml
baseURL = '[https://Athenea-sanchez.github.io/dynamixel-ctrl-main_md/](https://Athenea-sanchez.github.io/dynamixel-ctrl-main_md/)'
languageCode = 'es-es'
locale = 'es-es'
title = 'Documentación Dynamixel'
contentDir = 'content'
enableEmoji = true

[module]
  [[module.imports]]
    path = "[github.com/colinwilson/lotusdocs](https://github.com/colinwilson/lotusdocs)"
    disable = false
  [[module.imports]]
    path = "[github.com/gohugoio/hugo-mod-bootstrap-scss/v5](https://github.com/gohugoio/hugo-mod-bootstrap-scss/v5)"
    disable = false

[params]
  [params.docsearch]
    enable = false
  [params.sidebar]
    # Limpia la barra lateral para mostrar los títulos cortos
    collapsible = true
    showTitle = true

[markup]
  [markup.tableOfContents]
    startLevel = 2  # Empieza en H2 para evitar duplicar el título principal
    endLevel = 4
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
