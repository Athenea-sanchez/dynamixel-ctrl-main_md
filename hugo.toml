baseURL = "https://Athenea-sanchez.github.io/dynamixel-ctrl-main_md/"
languageCode = "es-es"
locale = "es-es"
title = "Documentación Dynamixel"
contentDir = "content"
enableEmoji = true

[module]
  [[module.imports]]
    path = "github.com/colinwilson/lotusdocs"
    disable = false
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    disable = false

[params]
  [params.docsearch]
    enable = false
  [params.sidebar]
    collapsible = true
    showTitle = true

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
